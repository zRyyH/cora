name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'landing-page/**'
      - 'site-institucional/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        site: [landing-page, site-institucional]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${owner}/cora-${{ matrix.site }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            SITE_DIR=${{ matrix.site }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.site }}
          cache-to: type=gha,mode=max,scope=${{ matrix.site }}

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -t ed25519,rsa "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Sync docker-compose.yml to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz -e "ssh -p ${SSH_PORT}" \
            docker-compose.yml \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Pull and restart on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: sha-${{ github.sha }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" "$IMAGE_TAG" "$REGISTRY_OWNER" "$GHCR_USER" "$GHCR_TOKEN" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH=$1; IMAGE_TAG=$2; REGISTRY_OWNER=$3; GHCR_USER=$4; GHCR_TOKEN=$5
          OWNER_LC=$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          cd "$DEPLOY_PATH"
          cat > .env <<EOF
          IMAGE_TAG=${IMAGE_TAG}
          REGISTRY_OWNER=${OWNER_LC}
          EOF
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          docker logout ghcr.io || true
          REMOTE

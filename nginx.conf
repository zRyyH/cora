server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite acessar URLs sem o sufixo .html (ex: /sobre -> /sobre.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache agressivo para assets estáticos
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|mp4|webm|woff2?|ttf|eot|pdf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Não cachear o HTML (para deploys aparecerem rapido)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Compressao
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Esconder versao do nginx
    server_tokens off;

    # Paginas de erro
    error_page 404 /index.html;
}

name: Release Please

on:
  push:
    branches: [main]

# Sem permissões para GITHUB_TOKEN — autenticação é via GitHub App.
# O App token vira o ator do PR/tag, e operações feitas por ele disparam
# os outros workflows (CI, Release) — coisa que o GITHUB_TOKEN não faz.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Manage release PR / publish tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
